# Push to main (merges included): checks -> pending DB migrations -> Vercel production.
# Vercel's own Git deployments are disabled for this project (gitProviderOptions.createDeployments = disabled),
# so this workflow is the only thing that publishes: no duplicate deploys.
name: main

on:
  push:
    branches: [main]

# One run at a time; a later push waits instead of cancelling a run that may be mid-migration.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Secrets cannot be read in a job-level `if`, so this job reports whether the publish secrets exist.
  # Without them (the repo has none yet) migrate and deploy are skipped instead of failing, and the run stays green.
  publish-enabled:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ] && [ -n "$VERCEL_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::notice::Publishing skipped: SUPABASE_DB_URL / VERCEL_TOKEN are not set as repository secrets."; fi

  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      # Includes supabase/tests: every migration is replayed on an in-memory Postgres.
      - run: npm test
      - run: npx next build

  migrate:
    needs: [checks, publish-enabled]
    if: needs.publish-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      # Lists what is pending; fails if the remote history has a version the repo lacks.
      - name: Dry run
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Applies only versions missing from supabase_migrations.schema_migrations; a no-op when none are.
      - name: Apply pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  deploy:
    needs: [migrate, publish-enabled]
    if: needs.publish-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      - run: vercel build --prod --token "$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
